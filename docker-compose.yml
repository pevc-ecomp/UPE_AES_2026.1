services:

  # ---------------------------------------------------------
  # BACKEND - FastAPI
  # ---------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: research_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=sqlite:////app/data/research.db
    volumes:
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_started
    mem_limit: 1g
    restart: unless-stopped

  # ---------------------------------------------------------
  # FRONTEND - Streamlit
  # ---------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: research_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - IA_JUDGE_URL=http://ia-judge:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
      - ia-judge
    mem_limit: 512m
    restart: unless-stopped

  # ---------------------------------------------------------
  # AI JUDGE - FastAPI
  # ---------------------------------------------------------
  ia-judge:
    build:
      context: .
      dockerfile: Dockerfile.ia-judge
    container_name: research_ia_judge
    ports:
      - "8002:8000"
    environment:
      - LLM_API_KEY=ollama
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=llama3.2:1b
    depends_on:
      ollama:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

  # ---------------------------------------------------------
  # LLM LOCAL - Ollama
  # phi3:mini  (~2.3 GB) - principal
  # llama3.2:1b (~1.3 GB) - fallback leve
  # ---------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: research_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 5g
    restart: unless-stopped

    # GPU NVIDIA (descomente se tiver placa compativel)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_data:

networks:
  default:
    name: research_network
